name: Проверка XML ИСМ

on:
  push:
    paths: ["data/**", "tools/**", ".github/workflows/validate.yml"]
  pull_request:
    paths: ["data/**", "tools/**"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить lxml
        run: pip install lxml
      - name: XSD, цитаты требований, XSLT, отсутствие ФИО
        run: python tools/validate.py data
