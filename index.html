<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ИСМ XML — машиночитаемые регламенты</title>
<meta name="description" content="Загрузка регламентов ИСМ из Word, PDF, Excel и XML, разметка атомарных требований, общий реестр требований, поиск пересечений, выгрузка в XML и Excel. Всё работает в браузере.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='22' fill='none' stroke='%2313677F' stroke-width='2.5'/%3E%3Cpath d='M3 19h26M17 19v8M9 11h12' stroke='%2313677F' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preload" href="assets/fonts/golos-text-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<a class="skip" href="#main">К содержимому</a>

<header class="topbar">
  <button class="icon-btn nav-toggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Содержание">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="brand" href="#/" aria-label="ИСМ XML — все документы">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="5" width="26" height="22"/><path d="M3 19h26M17 19v8M9 11h12"/></svg>
    <span class="brand-text"><span class="brand-name">ИСМ XML</span><span class="brand-doc">реестр требований</span></span>
  </a>

  <details class="menu doc-menu" id="docMenu">
    <summary class="doc-pick" aria-label="Выбрать документ"></summary>
    <div class="menu-panel" id="docMenuPanel" role="menu"></div>
  </details>

  <div class="search" role="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    <input id="searchInput" type="search" placeholder="Поиск по тексту, требованиям и терминам" autocomplete="off" aria-label="Поиск" aria-controls="searchResults">
    <kbd class="search-kbd" aria-hidden="true">/</kbd>
    <div class="search-results" id="searchResults" role="listbox" hidden></div>
  </div>

  <div class="top-actions">
    <label class="btn top-upload" title="Загрузить документы: Word, PDF, Excel-реестр, XML ИСМ">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M5 15v4h14v-4"/></svg>
      <span>Загрузить</span>
      <input type="file" class="up-input" multiple accept=".docx,.docm,.pdf,.xlsx,.xlsm,.xml">
    </label>
    <details class="menu" id="downloadMenu">
      <summary class="btn btn-primary">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
        <span>Выгрузить</span>
      </summary>
      <div class="menu-panel" id="dlPanel" role="menu"></div>
    </details>
  </div>
</header>

<div class="banner" id="banner" hidden></div>

<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="Документы и содержание">
    <div id="wsnav"></div>
    <nav class="toc" id="toc" aria-label="Содержание документа"></nav>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main id="main" tabindex="-1">
    <nav class="tabs" id="tabs" aria-label="Разделы приложения"></nav>
    <div id="view" class="view" aria-live="polite">
      <div class="loading">Открываю рабочее пространство…</div>
    </div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<dialog class="editor" id="editor" aria-label="Карточка требования"></dialog>
<div class="drop-hint" aria-hidden="true"><div>Отпустите файлы, чтобы загрузить их</div></div>

<script src="assets/store.js"></script>
<script src="assets/convert.js"></script>
<script src="assets/overlap.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
